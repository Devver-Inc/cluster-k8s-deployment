---
# Préparation système de base — Rocky Linux 9. Cible tous les noeuds
# (server+agent). Doit tourner avant 02-dependencies.yml.
#
# Usage :
#   ansible-playbook -i ../terraform/clusters/<org>/ansible-inventory/inventory-<org>.ini \
#     -e cluster_org=<org> playbooks/01-base.yml
- name: Préparation système de base (RKE2 prérequis)
  hosts: all
  gather_facts: true

  tasks:
    - name: Mettre à jour tous les paquets
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true

    - name: Configurer les serveurs DNS
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        content: |
          nameserver 1.1.1.1
          nameserver 1.0.0.1
        mode: "0644"

    - name: Désactiver IPv6 (sysctl, persistant)
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: "1"
        sysctl_file: /etc/sysctl.d/99-disable-ipv6.conf
        reload: true
      loop:
        - net.ipv6.conf.all.disable_ipv6
        - net.ipv6.conf.default.disable_ipv6

    - name: Désactiver le swap immédiatement
      ansible.builtin.command: swapoff -a
      when: ansible_swaptotal_mb > 0
      changed_when: true

    - name: Retirer toute entrée swap de /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: Charger les modules kernel requis par RKE2 au boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/rke2.conf
        content: |
          overlay
          br_netfilter
        mode: "0644"

    - name: Charger les modules kernel immédiatement
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Appliquer les sysctl réseau requis par RKE2 (bridge + forwarding)
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/99-rke2-network.conf
        reload: true
      loop:
        - { name: net.bridge.bridge-nf-call-iptables, value: "1" }
        - { name: net.bridge.bridge-nf-call-ip6tables, value: "1" }
        - { name: net.ipv4.ip_forward, value: "1" }

    - name: S'assurer que chronyd (NTP) est installé
      ansible.builtin.dnf:
        name: chrony
        state: present

    - name: S'assurer que chronyd est démarré et activé
      ansible.builtin.systemd:
        name: chronyd
        state: started
        enabled: true
