[defaults]
# Pas d'inventaire par défaut : chaque org a le sien
# (../terraform/clusters/<org>/ansible-inventory/inventory-<org>.ini),
# toujours passé explicitement via -i.
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
# Délai de connexion ET d'attente du prompt sudo (défaut 10 s). Pendant la
# jonction des masters, sudo a mis > 12 s sur un nœud chargé (vr3-dev) :
# échec du job configure alors que le cluster était sain.
timeout = 60

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
