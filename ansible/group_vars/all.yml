---
# Configuration Vault — même AppRole terraform-ci que côté Terraform (voir
# terraform/vault/main.tf), sa policy couvre déjà la lecture/écriture sur
# devver-infra-deployment/data/*. role_id/secret_id sont fournis à l'exécution
# via variables d'environnement (VAULT_ROLE_ID/VAULT_SECRET_ID), jamais en dur
# ici — cohérent avec le reste du projet (login.sh, workflows CI).
vault_addr: "https://vault.devver.app"
vault_auth_method: approle
vault_auth_mount_point: terraform-orgs
vault_role_id: "{{ lookup('env', 'VAULT_ROLE_ID') }}"
vault_secret_id: "{{ lookup('env', 'VAULT_SECRET_ID') }}"

# cluster_org DOIT être fourni au lancement (-e cluster_org=<org>) — détermine
# le chemin Vault devver-infra-deployment/<org> et le nom de l'inventaire.
vault_kv_mount: devver-infra-deployment
vault_cluster_secret_path: "{{ cluster_org }}"

# Version RKE2 installée par 02-dependencies.yml (script officiel get.rke2.io).
rke2_version: "v1.30.5+rke2r1"

# IP du 1er master du groupe [server] — point d'entrée unique pour la
# jonction des autres masters/agents (pas de VIP/HAProxy pour l'instant,
# cf. terraform/README.md et ansible/README.md pour la migration future).
rke2_first_server: "{{ groups['server'][0] }}"
rke2_first_server_ip: "{{ hostvars[rke2_first_server]['ansible_host'] }}"

# Secrets de l'org, lus une fois depuis Vault (KV v2) — utilisés comme
# ansible_ssh_private_key_file / ansible_become_password. La clé privée est
# écrite dans un fichier temporaire local le temps du run (jamais committée),
# nettoyé par un handler dans le playbook qui l'utilise.
cluster_secrets: "{{ lookup('community.hashi_vault.vault_kv2_get',
  vault_cluster_secret_path,
  engine_mount_point=vault_kv_mount,
  url=vault_addr,
  auth_method=vault_auth_method,
  mount_point=vault_auth_mount_point,
  role_id=vault_role_id,
  secret_id=vault_secret_id).secret }}"

ansible_user: "{{ cluster_secrets.vm_user }}"
# ansible_ssh_private_key_file n'est PAS défini ici — {{ playbook_dir }}
# ne se résout pas de façon fiable pour une variable de connexion (résolue
# très tôt, avant la première connexion SSH, dans un contexte différent de
# celui d'une tâche). Ansible retombait silencieusement sur aucune clé du
# tout (pas d'erreur "fichier introuvable", juste un Permission denied SSH
# qui ne pointe jamais vers la vraie cause). Le chemin absolu est passé
# explicitement en -e ansible_ssh_private_key_file=... par le workflow CI
# (voir .github/workflows/ansible-configure-clusters.yml) et par
# ansible/README.md pour un run manuel — cohérent avec fetch-ssh-key.sh qui
# écrit ce même fichier juste avant.
ansible_become: true
ansible_become_password: "{{ cluster_secrets.vm_password }}"
