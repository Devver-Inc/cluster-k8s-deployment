name: "2 - Proxmox: apply/destroy cluster"

# Déclenché manuellement, après "1 - Vault: création structure org" (voir ce workflow pour
# le contexte) — fait office de gate de validation humaine, puisque les
# GitHub Environments avec required reviewers ne sont pas disponibles en
# plan Free. L'admin relit le résumé du run "1 - Vault: création structure org"
# (org, action) et les retape ici volontairement, avant de lancer la suite.
on:
  workflow_dispatch:
    inputs:
      org:
        description: "Organisation concernée (nom du dossier clusters/<org>/)"
        required: true
        type: string
      action:
        description: "Action à poursuivre"
        required: true
        type: choice
        options: [create, delete]

env:
  VAULT_ADDR: ${{ vars.VAULT_ADDR }}

jobs:
  # --- Création ------------------------------------------------------------

  apply-infra-create:
    if: inputs.action == 'create'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # Un seul AppRole terraform-ci pour toutes les orgs (voir terraform/README.md) :
      # GitHub Actions ne permet pas de référencer secrets.X avec un nom
      # construit dynamiquement, donc un role par org obligerait à modifier ce
      # workflow à chaque ajout/suppression d'org. Le chemin Vault interrogé
      # s'adapte dynamiquement à l'org à la place (ligne "secrets:" ci-dessous).
      - name: Vault auth + fetch B2 credentials
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ vars.VAULT_ADDR }}
          method: approle
          path: terraform-orgs
          roleId: ${{ secrets.VAULT_CI_ROLE_ID }}
          secretId: ${{ secrets.VAULT_CI_SECRET_ID }}
          exportToken: true # sans ça, VAULT_TOKEN n'est jamais exporté et le
          # provider Vault de Terraform échoue en plein plan/apply/destroy.
          secrets: |
            devver-infra-deployment/data/s3-backend key_id | AWS_ACCESS_KEY_ID ;
            devver-infra-deployment/data/s3-backend application_key | AWS_SECRET_ACCESS_KEY

      - name: Terraform init
        working-directory: terraform/clusters/${{ inputs.org }}
        run: terraform init -backend-config=backend.hcl -input=false

      - name: Terraform plan
        working-directory: terraform/clusters/${{ inputs.org }}
        env:
          TF_VAR_vault_role_id: ${{ secrets.VAULT_CI_ROLE_ID }}
          TF_VAR_vault_secret_id: ${{ secrets.VAULT_CI_SECRET_ID }}
        run: terraform plan -input=false

      - name: Terraform apply
        working-directory: terraform/clusters/${{ inputs.org }}
        env:
          TF_VAR_vault_role_id: ${{ secrets.VAULT_CI_ROLE_ID }}
          TF_VAR_vault_secret_id: ${{ secrets.VAULT_CI_SECRET_ID }}
        run: terraform apply -auto-approve -input=false

  # --- Suppression -----------------------------------------------------------

  destroy-infra:
    if: inputs.action == 'delete'
    runs-on: self-hosted
    steps:
      # L'admin ne supprime jamais lui-même clusters/<org>/ — il déclenche ce
      # workflow directement, dossier encore présent. Un simple checkout du
      # commit courant suffit donc : plus besoin de retrouver un commit de
      # suppression dans l'historique (fragile, cf. commentaire du step
      # "Remove cluster folder and push" plus bas).
      - uses: actions/checkout@v4

      - name: Vault auth + fetch B2 credentials
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ vars.VAULT_ADDR }}
          method: approle
          path: terraform-orgs
          roleId: ${{ secrets.VAULT_CI_ROLE_ID }}
          secretId: ${{ secrets.VAULT_CI_SECRET_ID }}
          exportToken: true # sans ça, VAULT_TOKEN n'est jamais exporté et le
          # provider Vault de Terraform échoue en plein plan/apply/destroy.
          secrets: |
            devver-infra-deployment/data/s3-backend key_id | AWS_ACCESS_KEY_ID ;
            devver-infra-deployment/data/s3-backend application_key | AWS_SECRET_ACCESS_KEY

      - name: Terraform init
        working-directory: terraform/clusters/${{ inputs.org }}
        run: terraform init -backend-config=backend.hcl -input=false

      - name: Terraform destroy
        working-directory: terraform/clusters/${{ inputs.org }}
        env:
          TF_VAR_vault_role_id: ${{ secrets.VAULT_CI_ROLE_ID }}
          TF_VAR_vault_secret_id: ${{ secrets.VAULT_CI_SECRET_ID }}
        run: terraform destroy -auto-approve -input=false

      # Le destroy a réussi : c'est maintenant la pipeline elle-même qui
      # retire le dossier (pas l'admin) et pousse ce commit sur main — plus
      # de dépendance à un diff de commits précis pour retrouver le code
      # Terraform d'une org disparue. Ce commit redéclenchera
      # "1 - Vault: création structure org" (même trigger paths), qui se
      # terminera en action=none puisqu'aucune org n'y est ajoutée.
      - name: Remove cluster folder and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -r "terraform/clusters/${{ inputs.org }}"
          git commit -m "chore: remove clusters/${{ inputs.org }} after destroy"
          git push origin HEAD:main

  vault-cleanup:
    needs: destroy-infra
    if: inputs.action == 'delete'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Vault auth + fetch B2 credentials
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ vars.VAULT_ADDR }}
          method: approle
          path: terraform-orgs
          roleId: ${{ secrets.VAULT_CI_ROLE_ID }}
          secretId: ${{ secrets.VAULT_CI_SECRET_ID }}
          exportToken: true # sans ça, VAULT_TOKEN n'est jamais exporté et le
          # provider Vault de Terraform échoue en plein plan/apply/destroy.
          secrets: |
            devver-infra-deployment/data/s3-backend key_id | AWS_ACCESS_KEY_ID ;
            devver-infra-deployment/data/s3-backend application_key | AWS_SECRET_ACCESS_KEY

      # État RÉEL de Vault (pas un scan du repo, cf. terraform/README.md) —
      # ne retire QUE l'org explicitement ciblée par ce run (inputs.org, dont
      # l'infra vient d'être détruite juste avant). Toute autre org présente
      # dans Vault reste dans la liste appliquée, donc jamais affectée, même
      # si le checkout du repo est incomplet ou désynchronisé.
      - name: Compute orgs (existing minus target)
        id: orgs
        run: |
          remaining=$(bash terraform/scripts/list-vault-orgs.sh | grep -v "^${{ inputs.org }}$" || true)
          echo "orgs=$(printf '%s\n' "${remaining}" | jq -R . | jq -s -c 'map(select(length > 0))')" >> "$GITHUB_OUTPUT"

      - name: Terraform init
        working-directory: terraform/vault
        run: terraform init -backend-config=backend.hcl -input=false

      - name: Terraform apply (remove org structure)
        working-directory: terraform/vault
        run: terraform apply -auto-approve -input=false -var='orgs=${{ steps.orgs.outputs.orgs }}'
