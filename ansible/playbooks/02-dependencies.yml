---
# Dépendances (NFS client, firewalld) + installation du binaire RKE2 — sans
# démarrer le service (le démarrage/la jonction est le rôle de
# 03-cluster-init.yml). Cible tous les noeuds. À lancer après 01-base.yml.
#
# Usage :
#   ansible-playbook -i ../terraform/clusters/<org>/ansible-inventory/inventory-<org>.ini \
#     -e cluster_org=<org> playbooks/02-dependencies.yml
- name: Dépendances + installation RKE2
  hosts: all
  gather_facts: true
  # become au niveau du play — ansible_become: true seul dans
  # group_vars/all.yml ne s'applique pas de façon fiable (voir 01-base.yml).
  become: true

  tasks:
    - name: Installer nfs-utils (client NFS, requis par la storage class nfs.csi.k8s.io)
      ansible.builtin.dnf:
        name: nfs-utils
        state: present

    - name: S'assurer que firewalld est installé
      ansible.builtin.dnf:
        name: firewalld
        state: present

    - name: S'assurer que firewalld est démarré et activé
      ansible.builtin.systemd:
        name: firewalld
        state: started
        enabled: true

    - name: DIAGNOSTIC TEMPORAIRE - group_names et group_vars chargés
      ansible.builtin.debug:
        msg: "group_names={{ group_names }} | firewalld_ports défini: {{ firewalld_ports is defined }} | rke2_install_type défini: {{ rke2_install_type is defined }}"

    - name: Ouvrir les ports RKE2 requis pour ce rôle (server/agent)
      ansible.posix.firewalld:
        port: "{{ item.port }}/{{ item.proto }}"
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ firewalld_ports }}"

    - name: Ouvrir le CNI Flannel (VXLAN) et le trafic intra-cluster en zone trusted
      ansible.posix.firewalld:
        zone: trusted
        source: 192.168.45.0/24
        permanent: true
        immediate: true
        state: enabled

    - name: Vérifier si RKE2 est déjà installé
      ansible.builtin.stat:
        path: /usr/local/bin/rke2
      register: rke2_binary

    - name: Télécharger et installer RKE2 ({{ rke2_install_type }})
      ansible.builtin.shell: |
        curl -sfL https://get.rke2.io | \
        INSTALL_RKE2_VERSION={{ rke2_version }} \
        INSTALL_RKE2_TYPE={{ rke2_install_type }} \
        sh -
      args:
        creates: /usr/local/bin/rke2
      when: not rke2_binary.stat.exists
