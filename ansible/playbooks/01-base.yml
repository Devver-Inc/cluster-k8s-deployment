---
# Préparation système de base — Rocky Linux 9. Cible tous les noeuds
# (server+agent). Doit tourner avant 02-dependencies.yml.
#
# Usage :
#   ansible-playbook -i ../terraform/clusters/<org>/ansible-inventory/inventory-<org>.ini \
#     -e cluster_org=<org> playbooks/01-base.yml
- name: Préparation système de base (RKE2 prérequis)
  hosts: all
  gather_facts: true
  # become au niveau du play (pas seulement ansible_become: true dans
  # group_vars/all.yml, qui s'est révélé peu fiable dans ce contexte — mêmes
  # symptômes que le bug playbook_dir sur ansible_ssh_private_key_file :
  # échec silencieux, ex. "readonly database"/"not writable" sans jamais
  # signaler un problème de privilèges).
  become: true

  tasks:
    # Relance sur un cluster en service (job configure) : pas de mise à jour
    # complète des paquets. Elle durait ~15 min et redémarrait RKE2 (scripts
    # RPM) sur tous les nœuds à la fois — coupure des sites. Elle n'est faite
    # qu'à l'installation (RKE2 absent) ; ensuite, mises à jour OS à planifier
    # nœud par nœud. Les paquets rke2-* ne sont jamais mis à jour ici : la
    # version de RKE2 est celle de rke2_version (02-dependencies.yml).
    - name: RKE2 déjà installé ? (RPM -> /usr/bin, archive -> /usr/local/bin)
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: [/usr/bin/rke2, /usr/local/bin/rke2]
      register: _rke2_bin

    - name: Mettre à jour tous les paquets (nouveau nœud seulement)
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true
        exclude: "rke2-*"
      when: not (_rke2_bin.results | selectattr('stat.exists') | list)

    - name: Configurer les serveurs DNS
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        content: |
          nameserver 1.1.1.1
          nameserver 1.0.0.1
        mode: "0644"

    - name: Désactiver IPv6 (sysctl, persistant)
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: "1"
        sysctl_file: /etc/sysctl.d/99-disable-ipv6.conf
        reload: true
      loop:
        - net.ipv6.conf.all.disable_ipv6
        - net.ipv6.conf.default.disable_ipv6

    - name: Désactiver le swap immédiatement
      ansible.builtin.command: swapoff -a
      when: ansible_swaptotal_mb > 0
      changed_when: true

    - name: Retirer toute entrée swap de /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: Charger les modules kernel requis par RKE2 au boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/rke2.conf
        content: |
          overlay
          br_netfilter
        mode: "0644"

    - name: Charger les modules kernel immédiatement
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Appliquer les sysctl réseau requis par RKE2 (bridge + forwarding)
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/99-rke2-network.conf
        reload: true
      loop:
        - { name: net.bridge.bridge-nf-call-iptables, value: "1" }
        - { name: net.bridge.bridge-nf-call-ip6tables, value: "1" }
        - { name: net.ipv4.ip_forward, value: "1" }

    # Tous les conteneurs d'un nœud partagent ces limites (même uid root).
    # Valeur Rocky par défaut (128 instances) atteinte en single node :
    # "too many open files" (fsnotify) sur kube-controller-manager.
    - name: Relever les limites inotify
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/99-inotify.conf
        reload: true
      loop:
        - { name: fs.inotify.max_user_instances, value: "8192" }
        - { name: fs.inotify.max_user_watches, value: "524288" }

    - name: S'assurer que chronyd (NTP) est installé
      ansible.builtin.dnf:
        name: chrony
        state: present

    - name: S'assurer que chronyd est démarré et activé
      ansible.builtin.systemd:
        name: chronyd
        state: started
        enabled: true

    # Terraform active agent.enabled=true côté Proxmox pour toutes les VMs
    # (module/main.tf) — le paquet doit aussi être présent côté OS pour que
    # Proxmox obtienne les infos réseau/état réels de la VM (IP affichée dans
    # l'UI, arrêt propre, etc.). Idempotent : ne fait rien si déjà présent
    # (ex: déjà inclus dans le template rocky9-cloud-template).
    - name: S'assurer que qemu-guest-agent est installé
      ansible.builtin.dnf:
        name: qemu-guest-agent
        state: present

    - name: S'assurer que qemu-guest-agent est démarré et activé
      ansible.builtin.systemd:
        name: qemu-guest-agent
        state: started
        enabled: true
