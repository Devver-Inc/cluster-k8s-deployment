---
# Branche le cluster sur Vault pour les secrets applicatifs (External Secrets
# Operator) et initialise kubernetes-cluster/<org>/<env>/. À lancer après
# 03-cluster-init.yml, uniquement pour un cluster nommé <org>-<prod|staging|dev>
# (la structure Vault correspondante — mount, auth k8s-<org>-<env>, policies,
# roles — est créée par terraform/vault/k8s-secrets.tf).
#
# 1. Crée dans le cluster le ServiceAccount kube-system/vault-auth (token
#    longue durée + ClusterRoleBinding system:auth-delegator) : c'est le
#    "token reviewer" avec lequel Vault valide les JWT des ServiceAccounts
#    ESO (TokenReview). Rien d'autre côté cluster : ESO, ses ServiceAccounts
#    et les SecretStores sont déployés par ArgoCD (Devver-Inc/kubernetes).
# 2. Écrit auth/k8s-<org>-<env>/config (URL API + CA RKE2 + JWT reviewer).
# 3. Initialise chaque chemin du catalogue vars/vault-k8s-secrets.yml :
#    valeurs générées ou CHANGEME pour les clés ABSENTES uniquement — un
#    nouveau run ne réécrit jamais une valeur existante (idempotent).
# 4. Liste les clés restant à saisir dans la console Vault.
#
# Usage :
#   ansible-playbook -i ../terraform/clusters/<org>-<env>/ansible-inventory/inventory-<org>-<env>.ini \
#     -e cluster_org=<org>-<env> playbooks/05-vault-k8s.yml

- name: Brancher le cluster sur Vault (auth Kubernetes + secrets applicatifs)
  hosts: server[0]
  gather_facts: false
  # become requis pour lire le kubeconfig / CA RKE2 (0600, root).
  become: true

  vars_files:
    - ../vars/vault-k8s-secrets.yml

  vars:
    rke2_kubectl: /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
    vault_k8s_kv_mount: kubernetes-cluster
    vault_k8s_id_regex: "{{ cluster_id_regex }}"   # group_vars/all.yml
    vault_k8s_org: "{{ cluster_org | regex_replace(vault_k8s_id_regex, '\\1') }}"
    vault_k8s_env: "{{ cluster_org | regex_replace(vault_k8s_id_regex, '\\2') }}"
    vault_k8s_prefix: "{{ vault_k8s_org }}/{{ vault_k8s_env }}"
    vault_k8s_auth_mount: "k8s-{{ cluster_org }}"
    vault_k8s_todo: []

  tasks:
    - name: Vérifier le format de l'identifiant de cluster
      ansible.builtin.assert:
        that: cluster_org is regex(vault_k8s_id_regex)
        fail_msg: >-
          cluster_org='{{ cluster_org }}' n'est pas au format <org>-<prod|staging|dev> :
          pas de structure kubernetes-cluster/ pour ce cluster (voir terraform/vault/k8s-secrets.tf).
        quiet: true

    # --- 1. Token reviewer --------------------------------------------------

    - name: Créer le ServiceAccount kube-system/vault-auth (token reviewer de Vault)
      ansible.builtin.command:
        cmd: "{{ rke2_kubectl }} apply -f -"
        stdin: |
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: vault-auth
            namespace: kube-system
          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: vault-auth-token
            namespace: kube-system
            annotations:
              kubernetes.io/service-account.name: vault-auth
          type: kubernetes.io/service-account-token
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: vault-auth-tokenreview
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: system:auth-delegator
          subjects:
            - kind: ServiceAccount
              name: vault-auth
              namespace: kube-system
      register: _vault_auth_apply
      changed_when: "'created' in _vault_auth_apply.stdout or 'configured' in _vault_auth_apply.stdout"

    # Le token controller remplit le Secret de façon asynchrone.
    - name: Lire le JWT du token reviewer
      ansible.builtin.command:
        cmd: "{{ rke2_kubectl }} -n kube-system get secret vault-auth-token -o jsonpath={.data.token}"
      register: _vault_auth_token
      until: _vault_auth_token.stdout | length > 0
      retries: 12
      delay: 5
      changed_when: false
      no_log: true

    - name: Lire le CA de l'API Kubernetes
      ansible.builtin.slurp:
        src: /var/lib/rancher/rke2/server/tls/server-ca.crt
      register: _k8s_ca

    # --- 2. Config de l'auth Kubernetes ---------------------------------------

    # delegate_to: localhost — hvac n'est installé que sur le contrôleur (voir 03).
    - name: "Écrire auth/{{ vault_k8s_auth_mount }}/config"
      delegate_to: localhost
      community.hashi_vault.vault_write:
        url: "{{ vault_addr }}"
        auth_method: "{{ vault_auth_method }}"
        mount_point: "{{ vault_auth_mount_point }}"
        role_id: "{{ vault_role_id }}"
        secret_id: "{{ vault_secret_id }}"
        path: "auth/{{ vault_k8s_auth_mount }}/config"
        data:
          kubernetes_host: "https://{{ rke2_first_server_ip }}:6443"
          kubernetes_ca_cert: "{{ _k8s_ca.content | b64decode }}"
          token_reviewer_jwt: "{{ _vault_auth_token.stdout | b64decode }}"
          # Vault est hors cluster : ne pas chercher de JWT/CA locaux.
          disable_local_ca_jwt: true
      no_log: true

    # --- 3. Initialisation des secrets ----------------------------------------

    - name: Initialiser chaque chemin du catalogue
      ansible.builtin.include_tasks: tasks/vault-k8s-seed-path.yml
      loop: "{{ vault_k8s_secrets }}"
      loop_control:
        loop_var: seed
        label: "{{ vault_k8s_kv_mount }}/{{ vault_k8s_prefix }}/{{ seed.path }}"

    # --- 4. Récapitulatif -------------------------------------------------------

    - name: Secrets à compléter dans la console Vault
      ansible.builtin.debug:
        msg: >-
          {{ ('Cluster ' ~ cluster_org ~ ' branché sur Vault (auth/' ~ vault_k8s_auth_mount ~ '). '
              ~ 'Clés à saisir dans ' ~ vault_addr ~ '/ui sous ' ~ vault_k8s_kv_mount ~ '/' ~ vault_k8s_prefix ~ '/ : '
              ~ (vault_k8s_todo | join(', ')))
             if vault_k8s_todo | length > 0
             else ('Cluster ' ~ cluster_org ~ ' branché sur Vault — aucun secret à CHANGEME.') }}
