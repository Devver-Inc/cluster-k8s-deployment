name: "1 - Vault: création structure org"

# Push sur main touchant terraform/clusters/** : job "detect" compare l'état
# du repo (dossiers clusters/<org>/) à l'état réel de Vault (policies
# terraform-<org>-ro déjà créées) via detect-org-change.sh. Toute org
# présente dans le repo mais pas encore dans Vault déclenche automatiquement
# "vault-create" pour elle — pas de workflow_dispatch nécessaire pour ce cas.
#
# Pourquoi c'est sûr d'automatiser (contrairement à l'ancien comportement où
# la création nécessitait un déclenchement manuel) : "vault-create" ne
# recalcule JAMAIS la liste `orgs` depuis un scan du repo checkouté — il lit
# l'état RÉEL de Vault (list-vault-orgs.sh) et y AJOUTE seulement l'org
# ciblée. Aucune org déjà connue de Vault ne peut donc jamais en disparaître
# via ce chemin, même si le checkout est incomplet ou désynchronisé (c'est ce
# risque qui a réellement failli supprimer la structure Vault de "prod" avec
# l'ancien mécanisme à base de scan de repo complet — ce nouveau mécanisme
# ajoute une seule org à la fois, jamais de recalcul global).
#
# workflow_dispatch reste disponible pour une création manuelle ponctuelle
# (ex: rejouer après un échec), mais n'est plus le chemin principal.
#
# La structure Vault créée contient encore les placeholders du template
# (vm_password=CHANGE_ME, etc.) — "2 - Proxmox" (create-cluster) peut se
# déclencher dans la foulée sur le même push dès que la structure existe,
# mais échouera proprement (credentials VM invalides) tant que l'admin n'a
# pas saisi les vrais secrets dans Vault. Pas de risque, juste un job en
# erreur à corriger avant de repousser un commit trivial pour relancer.
on:
  push:
    branches: [main]
    paths:
      - "terraform/clusters/**"
  workflow_dispatch:
    inputs:
      org:
        description: "Organisation pour laquelle créer la structure Vault (nom du dossier clusters/<org>/)"
        required: true
        type: string

env:
  VAULT_ADDR: ${{ vars.VAULT_ADDR }}

jobs:
  # --- Détection (push uniquement) -----------------------------------------

  detect:
    if: github.event_name == 'push'
    runs-on: self-hosted
    outputs:
      orgs: ${{ steps.detect.outputs.orgs }}
    steps:
      - uses: actions/checkout@v4

      # Nécessaire pour lire l'état réel de Vault (list-vault-orgs.sh) — le
      # CLI vault utilise VAULT_ADDR/VAULT_TOKEN exportés par exportToken.
      - name: Vault auth
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ vars.VAULT_ADDR }}
          method: approle
          path: terraform-orgs
          roleId: ${{ secrets.VAULT_CI_ROLE_ID }}
          secretId: ${{ secrets.VAULT_CI_SECRET_ID }}
          exportToken: true

      - id: detect
        run: bash terraform/scripts/detect-org-change.sh

  # --- Création --------------------------------------------------------------

  vault-create:
    needs: detect
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.detect.result == 'success' && needs.detect.outputs.orgs != '[]'))
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        org: ${{ github.event_name == 'workflow_dispatch' && fromJson(format('[{0}]', toJson(inputs.org))) || fromJson(needs.detect.outputs.orgs || '[]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Vault auth + fetch B2 credentials
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ vars.VAULT_ADDR }}
          method: approle
          path: terraform-orgs
          roleId: ${{ secrets.VAULT_CI_ROLE_ID }}
          secretId: ${{ secrets.VAULT_CI_SECRET_ID }}
          exportToken: true
          secrets: |
            devver-infra-deployment/data/s3-backend key_id | AWS_ACCESS_KEY_ID ;
            devver-infra-deployment/data/s3-backend application_key | AWS_SECRET_ACCESS_KEY

      # État RÉEL de Vault (pas un scan du repo) + ajout de l'org ciblée
      # uniquement — jamais un recalcul complet depuis le repo checkouté.
      - name: Compute orgs (existing + target)
        id: orgs
        run: |
          current=$(bash terraform/scripts/list-vault-orgs.sh)
          new_list=$(printf '%s\n%s\n' "${current}" "${{ matrix.org }}" | grep -v '^$' | sort -u | jq -R . | jq -s -c .)
          echo "orgs=${new_list}" >> "$GITHUB_OUTPUT"

      - name: Terraform init
        working-directory: terraform/vault
        run: terraform init -backend-config=backend.hcl -input=false

      - name: Terraform apply (add target org, never remove existing ones)
        working-directory: terraform/vault
        run: terraform apply -auto-approve -input=false -var='orgs=${{ steps.orgs.outputs.orgs }}'

      - name: Write summary
        run: |
          {
            echo "## Structure Vault créée — \`${{ matrix.org }}\`"
            echo ""
            echo "Avant que \`2 - Proxmox\` (create-cluster) ne puisse aboutir :"
            echo ""
            echo "1. Saisir les vrais secrets dans Vault (\`vm_password\`, \`ssh_private_key\`, ...) sur \`devver-infra-deployment/${{ matrix.org }}\`."
            echo "2. Pousser un commit (même trivial) touchant \`terraform/clusters/${{ matrix.org }}/\` pour redéclencher \`2 - Proxmox\`, si le job create-cluster a déjà échoué faute de vrais secrets."
          } >> "$GITHUB_STEP_SUMMARY"
