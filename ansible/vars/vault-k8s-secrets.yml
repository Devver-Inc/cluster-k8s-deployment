---
# Catalogue des secrets applicatifs d'un cluster, sous
# kubernetes-cluster/<org>/<env>/<path> (structure créée par
# terraform/vault/k8s-secrets.tf, valeurs initialisées par
# playbooks/05-vault-seed.yml dès le 1er lancement de la pipeline, avant
# même que le cluster existe).
#
# Classes (mode) :
#   generate    : valeur aléatoire (length, chars) — on ne choisit pas la valeur
#   static      : valeur fixe non secrète (ex: un nom d'utilisateur)
#   shared      : commune à tous les clusters, saisie UNE fois dans
#                 devver-infra-deployment/shared/<path> et copiée ici ; tant
#                 qu'elle manque : CHANGEME, et le déploiement est BLOQUÉ
#   manual-pre  : propre au cluster, à saisir AVANT le déploiement (BLOQUANT)
#   manual-post : à saisir APRÈS l'installation (n'existe qu'une fois l'outil
#                 installé, ex: Logto) — non bloquant pour la pipeline ; le
#                 garde-fou ESO bloque seulement le pod qui l'utilise
#   auto-post   : remplie par la pipeline après l'installation
#                 (playbooks/06-argocd-bootstrap.yml) — non bloquant
#
# Une clé déjà présente n'est JAMAIS réécrite, sauf une clé "shared" encore à
# CHANGEME (recopiée dès que la valeur commune existe). Ajouter une clé ici
# puis relancer ne touche qu'à la nouvelle clé.
#
# Les ExternalSecrets qui consomment ces chemins sont dans Devver-Inc/kubernetes
# (chart platform-secrets) — garder les deux synchronisés.

vault_k8s_secrets:
  - path: cloudflare
    fields:
      - name: api_token
        mode: shared
        desc: "Token API Cloudflare (Zone:DNS:Edit) — cert-manager (DNS-01) et external-dns"

  - path: ghcr
    fields:
      - name: username
        mode: shared
        desc: "Compte GitHub propriétaire du token GHCR"
      - name: token
        mode: shared
        desc: "PAT GitHub read:packages — pull des images ghcr.io/devver-inc/*"

  - path: github
    fields:
      - name: token
        mode: shared
        desc: "PAT GitHub du backend — écrit dans Devver-Inc/argocd-client-deployment (GITHUB_TOKEN)"

  - path: minio
    fields:
      - name: root_user
        mode: static
        value: devver-admin
        desc: "Utilisateur root MinIO (aussi STORAGE_ACCESS_KEY du backend)"
      - name: root_password
        mode: generate
        length: 40
        desc: "Mot de passe root MinIO (aussi STORAGE_SECRET_KEY du backend)"

  - path: logto-postgres
    fields:
      - name: username
        mode: static
        value: logto
        desc: "Utilisateur Postgres de Logto"
      - name: password
        mode: generate
        length: 40
        desc: "Mot de passe Postgres de Logto"

  - path: backend
    fields:
      - name: ENCRYPTION_KEY
        mode: generate
        length: 64
        chars: ["0123456789abcdef"]
        desc: "Clé de chiffrement applicative (hex 64 = 32 octets — format à confirmer avec les devs). NE PAS roter sans re-chiffrer la base."
      - name: DEPLOY_AGENT_SECRET
        mode: generate
        length: 48
        desc: "Secret partagé backend ↔ deploy-agent"
      - name: GIT_TOKEN_SECRET
        mode: generate
        length: 48
        desc: "Secret de signature des tokens Git du backend"
      - name: LOGTO_CLIENT_ID
        mode: manual-post
        desc: "Client ID de l'application backend dans Logto (après install de Logto)"
      - name: LOGTO_SECRET
        mode: manual-post
        desc: "Client secret de l'application backend dans Logto (après install de Logto)"
      - name: LOGTO_WEBHOOK_SIGNING_KEY
        mode: manual-post
        desc: "Signing key du webhook Logto → backend (après install de Logto)"
      - name: ARGOCD_API_KEY
        mode: auto-post
        desc: "Token du compte ArgoCD backend-api — généré par 06-argocd-bootstrap.yml"
      - name: VAULT_KV_PREFIX
        mode: static
        value: "{{ vault_k8s_kv_mount }}/{{ vault_k8s_prefix }}"
        desc: "Préfixe KV des secrets clients pour le backend (kubernetes-cluster/<org>/<env>)"
      # Auth Vault du backend : Kubernetes (jeton de son ServiceAccount
      # backend-service), aucun secret — seulement où et sous quel rôle se
      # connecter (terraform/vault/k8s-secrets.tf, role "backend").
      - name: VAULT_AUTH_MOUNT
        mode: static
        value: "k8s-{{ cluster_org }}"
        desc: "Mount de l'auth Kubernetes du cluster (login : auth/<mount>/login)"
      - name: VAULT_ROLE
        mode: static
        value: backend
        desc: "Rôle Vault du backend dans l'auth Kubernetes"

  # Accès d'ArgoCD aux repos privés : deploy keys SSH en lecture seule (une
  # par repo, créées une fois sur GitHub). Utilisées au bootstrap par
  # 06-argocd-bootstrap.yml, puis reprises par l'ExternalSecret de
  # platform-secrets (Secrets de repo dans le namespace argocd).
  - path: argocd-repos
    fields:
      - name: kubernetes
        mode: shared
        desc: "Clé privée SSH de la deploy key (lecture seule) de Devver-Inc/kubernetes"
      - name: client-deployment
        mode: shared
        desc: "Clé privée SSH de la deploy key (lecture seule) de Devver-Inc/argocd-client-deployment"

  - path: argocd
    fields:
      - name: admin_password
        mode: auto-post
        desc: "Mot de passe admin ArgoCD — généré par Argo, copié ici par 06-argocd-bootstrap.yml"
