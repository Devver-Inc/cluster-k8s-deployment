name: "1 - Vault: création structure org"

# Déclenché par TOUT commit poussé sur main, quel que soit le fichier modifié
# (pas de filtre "paths") — plus simple et sans angle mort : au pire aucune
# org n'a besoin d'être créée, detect-org-change.sh renvoie action=none et le
# run se termine en succès sans rien faire. Détecte si une org du repo n'a
# pas encore de structure Vault, la prépare, puis s'arrête — la suite (apply
# infra) se poursuit manuellement via le workflow "2 - Proxmox: apply/destroy
# cluster" (workflow_dispatch).
#
# detect-org-change.sh compare l'état du repo (dossiers clusters/<org>/) à
# l'état réel de Vault (policies terraform-<org>-ro déjà créées), plutôt qu'un
# diff entre deux commits git — ce dernier mécanisme s'est révélé peu fiable
# en pratique (une org ajoutée puis "perdue" si d'autres commits/push
# s'enchaînent avant qu'un run réussisse). La comparaison d'état donne
# toujours le bon résultat, peu importe l'historique.
#
# Ne gère QUE les créations : la suppression d'un cluster ne passe pas par ce
# workflow — elle se pilote directement via workflow_dispatch sur
# "2 - Proxmox...", qui retire lui-même le dossier une fois le destroy infra
# confirmé réussi. Ce commit automatique de suppression redéclenchera aussi ce
# workflow-ci (trigger sur tout push) : le job "detect" renverra alors
# action=none, et rien ne s'exécutera — comportement normal, pas une erreur.
#
# Pourquoi en 2 workflows séparés plutôt qu'un seul avec des gates : les
# GitHub Environments avec required reviewers (le mécanisme natif de pause)
# ne sont pas disponibles sur un repo privé en plan Free. Un second
# déclenchement manuel joue ce rôle à la place, gratuitement sur tout plan.
on:
  push:
    branches: [main]

env:
  VAULT_ADDR: ${{ vars.VAULT_ADDR }}

jobs:
  detect:
    runs-on: self-hosted
    outputs:
      org: ${{ steps.detect.outputs.org }}
      action: ${{ steps.detect.outputs.action }}
    steps:
      - uses: actions/checkout@v4

      # Nécessaire pour lire l'état réel de Vault (list-vault-orgs.sh) — le
      # CLI vault utilise VAULT_ADDR/VAULT_TOKEN exportés par exportToken.
      - name: Vault auth
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ vars.VAULT_ADDR }}
          method: approle
          path: terraform-orgs
          roleId: ${{ secrets.VAULT_CI_ROLE_ID }}
          secretId: ${{ secrets.VAULT_CI_SECRET_ID }}
          exportToken: true

      - id: detect
        run: bash terraform/scripts/detect-org-change.sh

  vault-sync:
    needs: detect
    if: needs.detect.outputs.action == 'create'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Vault auth + fetch B2 credentials
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ vars.VAULT_ADDR }}
          method: approle
          path: terraform-orgs
          roleId: ${{ secrets.VAULT_CI_ROLE_ID }}
          secretId: ${{ secrets.VAULT_CI_SECRET_ID }}
          secrets: |
            devver-infra-deployment/data/s3-backend key_id | AWS_ACCESS_KEY_ID ;
            devver-infra-deployment/data/s3-backend application_key | AWS_SECRET_ACCESS_KEY

      - name: List orgs
        id: orgs
        run: echo "orgs=$(bash terraform/scripts/list-orgs.sh)" >> "$GITHUB_OUTPUT"

      - name: Terraform init
        working-directory: terraform/vault
        run: terraform init -backend-config=backend.hcl -input=false

      - name: Terraform apply (create org structure)
        working-directory: terraform/vault
        run: terraform apply -auto-approve -input=false -var='orgs=${{ steps.orgs.outputs.orgs }}'

  summary:
    needs: [detect, vault-sync]
    if: needs.detect.outputs.action == 'create'
    runs-on: self-hosted
    steps:
      - name: Write summary
        env:
          ORG: ${{ needs.detect.outputs.org }}
        run: |
          {
            echo "## Suite à donner"
            echo ""
            echo "Structure Vault créée pour \`${ORG}\`. Avant de continuer :"
            echo ""
            echo "1. Saisir les vrais secrets dans Vault (\`vm_password\`, \`ssh_private_key\`, ...) sur \`devver-infra-deployment/${ORG}\`."
            echo "2. Aller dans **Actions > 2 - Proxmox: apply/destroy cluster > Run workflow**."
            echo "3. Renseigner : \`org=${ORG}\` et \`action=create\`."
          } >> "$GITHUB_STEP_SUMMARY"
