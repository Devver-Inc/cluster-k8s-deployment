---
# Init du cluster RKE2 : 1er master → masters suivants → agents, puis
# récupération du kubeconfig + token de jonction, écrits dans Vault.
# À lancer après 02-dependencies.yml.
#
# Jonction : tous les noeuds pointent directement vers l'IP du 1er master
# (pas de VIP/HAProxy pour l'instant — cf. terraform/README.md pour la
# migration future vers un load-balancer devant les masters).
#
# Usage :
#   ansible-playbook -i ../terraform/clusters/<org>/ansible-inventory/inventory-<org>.ini \
#     -e cluster_org=<org> playbooks/03-cluster-init.yml

- name: Initialiser le premier master RKE2
  hosts: server[0]
  gather_facts: false
  # become au niveau du play — ansible_become: true seul dans
  # group_vars/all.yml ne s'applique pas de façon fiable (voir 01-base.yml).
  become: true

  tasks:
    - name: Créer /etc/rancher/rke2/
      ansible.builtin.file:
        path: /etc/rancher/rke2
        state: directory
        mode: "0755"

    # --- Ingress : Traefik (défaut RKE2 >= 1.36) sur l'IP réservée par Terraform
    # Manifestes "auto-deploy" de RKE2 : tout fichier de ce dossier est appliqué
    # (et ré-appliqué s'il change) par RKE2 lui-même, avant toute autre chose.
    - name: Vérifier que l'IP de l'ingress est fournie par l'inventaire
      ansible.builtin.assert:
        that: metallb_ip is defined and metallb_ip is match('^([0-9]{1,3}\\.){3}[0-9]{1,3}$')
        fail_msg: "metallb_ip absent de l'inventaire (terraform/module/inventory.tpl) — relancer terraform apply du cluster."
        quiet: true

    - name: Créer le dossier des manifestes auto-déployés par RKE2
      ansible.builtin.file:
        path: /var/lib/rancher/rke2/server/manifests
        state: directory
        mode: "0700"

    - name: MetalLB (HelmChart déployé par RKE2)
      ansible.builtin.copy:
        dest: /var/lib/rancher/rke2/server/manifests/devver-metallb.yaml
        mode: "0600"
        content: |
          apiVersion: v1
          kind: Namespace
          metadata:
            name: metallb-system
          ---
          apiVersion: helm.cattle.io/v1
          kind: HelmChart
          metadata:
            name: metallb
            namespace: kube-system
          spec:
            repo: https://metallb.github.io/metallb
            chart: metallb
            version: "{{ metallb_chart_version }}"
            targetNamespace: metallb-system

    # Fichier séparé : ses CRD n'existent qu'une fois le chart MetalLB installé.
    # Le contrôleur de déploiement de RKE2 doit réessayer l'application tant
    # qu'elles manquent — à confirmer au premier déploiement.
    - name: MetalLB — pool limité à l'IP de l'ingress, annoncé en L2
      ansible.builtin.copy:
        dest: /var/lib/rancher/rke2/server/manifests/devver-metallb-pool.yaml
        mode: "0600"
        content: |
          apiVersion: metallb.io/v1beta1
          kind: IPAddressPool
          metadata:
            name: ingress
            namespace: metallb-system
          spec:
            addresses:
              - {{ metallb_ip }}/32
          ---
          apiVersion: metallb.io/v1beta1
          kind: L2Advertisement
          metadata:
            name: ingress
            namespace: metallb-system
          spec:
            ipAddressPools:
              - ingress

    - name: Traefik — Service LoadBalancer sur l'IP de l'ingress
      ansible.builtin.copy:
        dest: /var/lib/rancher/rke2/server/manifests/rke2-traefik-config.yaml
        mode: "0600"
        content: |
          apiVersion: helm.cattle.io/v1
          kind: HelmChartConfig
          metadata:
            name: rke2-traefik
            namespace: kube-system
          spec:
            valuesContent: |-
              service:
                type: LoadBalancer
                # Le chart rke2-traefik impose service.spec.type: ClusterIP,
                # qui écrase service.type : il faut le surcharger aussi.
                spec:
                  type: LoadBalancer
                annotations:
                  metallb.io/loadBalancerIPs: "{{ metallb_ip }}"
              ports:
                websecure:
                  # En-têtes de sécurité sur toutes les routes HTTPS (repris de
                  # kubernetes/traefik/traefik-values.yaml). Le Middleware
                  # kube-system/security-headers est déployé par ArgoCD (wave 0) ;
                  # d'ici là, les routes websecure sont en erreur — attendu au
                  # bootstrap (l'UI Argo est joignable par port-forward).
                  middlewares:
                    - kube-system-security-headers@kubernetescrd

    - name: "Écrire la config RKE2 du premier master (pas de champ server, c'est lui le point d'entrée)"
      ansible.builtin.copy:
        dest: /etc/rancher/rke2/config.yaml
        content: |
          write-kubeconfig-mode: "0640"
        mode: "0644"

    - name: Démarrer et activer rke2-server
      ansible.builtin.systemd:
        name: rke2-server
        state: started
        enabled: true

    - name: Attendre que le node-token soit généré
      ansible.builtin.wait_for:
        path: /var/lib/rancher/rke2/server/node-token
        timeout: 300

    - name: Attendre que l'API Kubernetes réponde
      ansible.builtin.wait_for:
        port: 6443
        host: 127.0.0.1
        timeout: 300

    - name: Lire le node-token généré
      ansible.builtin.slurp:
        src: /var/lib/rancher/rke2/server/node-token
      register: rke2_node_token_raw

    - name: Exposer le token pour les plays suivants
      ansible.builtin.set_fact:
        rke2_join_token: "{{ rke2_node_token_raw.content | b64decode | trim }}"
        cacheable: true

- name: Joindre les masters supplémentaires
  hosts: server:!server[0]
  gather_facts: false
  become: true
  vars:
    rke2_join_token: "{{ hostvars[groups['server'][0]]['rke2_join_token'] }}"

  tasks:
    - name: Créer /etc/rancher/rke2/
      ansible.builtin.file:
        path: /etc/rancher/rke2
        state: directory
        mode: "0755"

    - name: Écrire la config RKE2 (jonction vers le premier master)
      ansible.builtin.copy:
        dest: /etc/rancher/rke2/config.yaml
        content: |
          server: "https://{{ rke2_first_server_ip }}:9345"
          token: "{{ rke2_join_token }}"
          write-kubeconfig-mode: "0640"
        mode: "0644"
      no_log: true

    - name: Démarrer et activer rke2-server
      ansible.builtin.systemd:
        name: rke2-server
        state: started
        enabled: true

- name: Joindre les workers (agents)
  hosts: agent
  gather_facts: false
  become: true
  vars:
    rke2_join_token: "{{ hostvars[groups['server'][0]]['rke2_join_token'] }}"

  tasks:
    - name: Créer /etc/rancher/rke2/
      ansible.builtin.file:
        path: /etc/rancher/rke2
        state: directory
        mode: "0755"

    - name: Écrire la config RKE2 (jonction vers le premier master)
      ansible.builtin.copy:
        dest: /etc/rancher/rke2/config.yaml
        content: |
          server: "https://{{ rke2_first_server_ip }}:9345"
          token: "{{ rke2_join_token }}"
        mode: "0644"
      no_log: true

    - name: Démarrer et activer rke2-agent
      ansible.builtin.systemd:
        name: rke2-agent
        state: started
        enabled: true

- name: Récupérer le kubeconfig et le token, les écrire dans Vault
  hosts: server[0]
  gather_facts: false
  # become requis pour lire /etc/rancher/rke2/rke2.yaml (0600 par défaut).
  become: true

  tasks:
    - name: Attendre que tous les noeuds aient rejoint (kubelet up)
      ansible.builtin.pause:
        seconds: 30

    - name: Lire le kubeconfig généré par RKE2
      ansible.builtin.slurp:
        src: /etc/rancher/rke2/rke2.yaml
      register: rke2_kubeconfig_raw

    - name: Adapter le kubeconfig (127.0.0.1 -> IP réelle du premier master)
      ansible.builtin.set_fact:
        rke2_kubeconfig_final: "{{ (rke2_kubeconfig_raw.content | b64decode)
          | regex_replace('https://127\\.0\\.0\\.1:6443', 'https://' + rke2_first_server_ip + ':6443') }}"

    # vault_kv2_write fait un PUT complet (écrase tout le secret) — on repart
    # donc de cluster_secrets (déjà lu en entier en group_vars/all.yml au
    # début du run) et on y combine les 2 nouveaux champs, pour ne perdre
    # aucun champ existant (vm_user, ssh_public_key, vm_password,
    # ssh_private_key). Ne PAS remplacer par un data_json partiel.
    - name: Fusionner les secrets existants avec kubeconfig + token
      ansible.builtin.set_fact:
        cluster_secrets_updated: "{{ cluster_secrets | combine({'kubeconfig': rke2_kubeconfig_final, 'rke2_token': rke2_join_token}) }}"
      no_log: true

    # delegate_to: localhost — ce module (contrairement au lookup vault_kv2_get
    # utilisé dans group_vars/all.yml, toujours exécuté côté contrôleur) est
    # une tâche Ansible classique, exécutée par défaut sur l'hôte cible
    # (master-1, une VM Rocky Linux sans hvac installé — "Failed to import
    # the required Python library (hvac)"). Le contrôleur (conteneur CI) a
    # hvac, donc c'est là qu'il faut exécuter cette tâche.
    - name: Écrire kubeconfig + token dans Vault (sans écraser les champs existants)
      delegate_to: localhost
      community.hashi_vault.vault_kv2_write:
        url: "{{ vault_addr }}"
        auth_method: "{{ vault_auth_method }}"
        mount_point: "{{ vault_auth_mount_point }}"
        role_id: "{{ vault_role_id }}"
        secret_id: "{{ vault_secret_id }}"
        engine_mount_point: "{{ vault_kv_mount }}"
        path: "{{ vault_cluster_secret_path }}"
        data: "{{ cluster_secrets_updated }}"
      no_log: true

    - name: Cluster RKE2 initialisé
      ansible.builtin.debug:
        msg: "Cluster '{{ cluster_org }}' prêt — kubeconfig et rke2_token écrits dans devver-infra-deployment/{{ vault_cluster_secret_path }}."
