name: "3 - Ansible: configurer les clusters"

# Déclenché uniquement par un changement sous ansible/ (playbooks, group_vars,
# etc.) — volontairement indépendant de Terraform/Vault (aucun trigger sur
# terraform/clusters/**) : un nouveau cluster créé côté Terraform n'aura
# Ansible appliqué qu'au prochain push ansible/, ou lancé manuellement en
# local entre-temps (cf. ansible/README.md).
#
# Applique automatiquement les 3 playbooks à TOUS les clusters existants
# (scan de terraform/clusters/<org>/ via list-orgs.sh, un job par org via une
# matrix) — accepté sans confirmation manuelle car les playbooks sont
# idempotents : les rejouer sur un cluster déjà configuré ne doit rien casser.
#
# Tout le job (y compris le login Vault) tourne dans un conteneur Docker
# custom (runner-images/ansible/Dockerfile) — le runner self-hosted n'a besoin
# que de Docker, pas d'Ansible/vault CLI installés en dur. L'image est
# construite une fois et réutilisée tant que la ligne IMAGE_VERSION= en tête
# du Dockerfile ne change pas (voir job build-image ci-dessous).
#
# Un job qui déclare container: fait toujours un "docker pull" avant de
# démarrer (jamais de fallback sur le cache local) — l'image doit donc être
# poussée sur un registry, même en auto-hébergé. On utilise GHCR (gratuit,
# repo privé inclus), avec GITHUB_TOKEN (permission packages: write, pas de
# secret supplémentaire à gérer).
on:
  push:
    branches: [main]
    paths:
      - "ansible/**"
      - "runner-images/ansible/**"
      - ".github/workflows/ansible-configure-clusters.yml"
  workflow_dispatch: {}

env:
  VAULT_ADDR: ${{ vars.VAULT_ADDR }}
  IMAGE_NAME: ghcr.io/${{ github.repository }}/ansible-runner

jobs:
  build-image:
    runs-on: self-hosted
    permissions:
      packages: write
      contents: read
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: |
          version="$(grep -oP '^# IMAGE_VERSION=\K.+' runner-images/ansible/Dockerfile)"
          # GHCR exige un nom de repository en minuscules — github.repository
          # garde la casse réelle de l'owner/repo GitHub (ex: Devver-Inc).
          image_name="${IMAGE_NAME,,}"
          echo "image=${image_name}:${version}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Réutilise l'image si elle existe déjà sur GHCR pour cette version —
      # rebuild uniquement quand la ligne IMAGE_VERSION= du Dockerfile a été
      # incrémentée (donc quand le Dockerfile ou requirements.yml a changé).
      - name: Build & push Ansible runner image (si absente pour cette version)
        run: |
          set -euo pipefail
          IMAGE="${{ steps.tag.outputs.image }}"
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Image $IMAGE déjà présente sur GHCR, build sauté."
          else
            docker build -f runner-images/ansible/Dockerfile -t "$IMAGE" .
            docker push "$IMAGE"
          fi

  list-clusters:
    needs: build-image
    runs-on: self-hosted
    container:
      image: ${{ needs.build-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      orgs: ${{ steps.list.outputs.orgs }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "orgs=$(bash terraform/scripts/list-orgs.sh)" >> "$GITHUB_OUTPUT"

  configure:
    needs: [build-image, list-clusters]
    if: needs.list-clusters.outputs.orgs != '' && needs.list-clusters.outputs.orgs != '[]'
    runs-on: self-hosted
    container:
      image: ${{ needs.build-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      # strategy est évalué avant que le if: du job ne puisse le sauter — un
      # orgs vide (ex: list-clusters en échec) ferait planter fromJson('') ici
      # même si le job entier va être skip, d'où le fallback explicite '[]'.
      matrix:
        org: ${{ fromJson(needs.list-clusters.outputs.orgs || '[]') }}
    steps:
      - uses: actions/checkout@v4

      # Même AppRole terraform-ci que Terraform (voir terraform/README.md) —
      # sa policy couvre déjà la lecture/écriture sur devver-infra-deployment/data/*.
      # Tourne dans le même conteneur que les playbooks (voir container: au
      # niveau du job) : le token Vault n'est jamais exposé à plat sur le runner.
      - name: Resolve Vault AppRole credentials
        id: vault_login
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ vars.VAULT_ADDR }}
          method: approle
          path: terraform-orgs
          roleId: ${{ secrets.VAULT_CI_ROLE_ID }}
          secretId: ${{ secrets.VAULT_CI_SECRET_ID }}
          exportToken: true

      # ansible_ssh_private_key_file (group_vars/all.yml) est résolu avant la
      # première connexion SSH — la clé doit donc exister sur disque avant
      # ansible-playbook (voir ansible/README.md). fetch-ssh-key.sh est
      # sourcé pour que VAULT_TOKEN (déjà exporté par le step précédent) et le
      # nettoyage (trap EXIT) restent dans le même shell que les 3 playbooks.
      - name: Run Ansible playbooks
        working-directory: ansible
        shell: bash
        run: |
          set -euo pipefail
          source ./fetch-ssh-key.sh "${{ matrix.org }}"

          INV="../terraform/clusters/${{ matrix.org }}/ansible-inventory/inventory-${{ matrix.org }}.ini"

          # DIAGNOSTIC TEMPORAIRE -vvv sur le 1er playbook uniquement, pour
          # voir précisément quel fichier de clé/quelle méthode SSH Ansible
          # utilise réellement (jamais le contenu de la clé, juste les
          # commandes SSH exécutées) — la même clé marche en connexion
          # manuelle mais échoue via ce pipeline.
          ansible-playbook -vvv -i "$INV" -e cluster_org="${{ matrix.org }}" playbooks/01-base.yml
          ansible-playbook -i "$INV" -e cluster_org="${{ matrix.org }}" playbooks/02-dependencies.yml
          ansible-playbook -i "$INV" -e cluster_org="${{ matrix.org }}" playbooks/03-cluster-init.yml
